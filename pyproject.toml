[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtalk"
version = "0.1.0"
description = "Encoding graphs as text for LLMs, building on Talk like a Graph (arXiv:2310.04560)"
requires-python = ">=3.11,<3.12"

dependencies = [
    "networkx>=3.6",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Everything except graph_tasks_utils.py runs on the base deps above.
# These are only needed for that module's TFRecord/eval pipeline.
pipeline = [
    "tensorflow==2.20.0",
    "tensorflow-gnn==1.0.3",
    "tf-keras==2.21.0",
    "seqio==0.0.20",
]
dev = [
    "absl-py>=2.5",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["talk_like_a_graph"]

[tool.setuptools]
packages = ["talk_like_a_graph"]
