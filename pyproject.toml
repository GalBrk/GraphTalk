[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtalk"
version = "0.1.0"
description = "Encoding graphs as text for LLMs, building on Talk like a Graph (arXiv:2310.04560)"
requires-python = ">=3.11,<3.12"

dependencies = [
    "networkx>=3.6",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Everything except graph_tasks_utils.py runs on the base deps above.
# These are only needed for that module's TFRecord/eval pipeline.
pipeline = [
    "tensorflow==2.20.0",
    "tensorflow-gnn==1.0.3",
    "tf-keras==2.21.0",
    "seqio==0.0.20",
]
dev = [
    "absl-py>=2.5",
    "pytest>=8",
]
# Only graphtalk/analysis.py and its scripts (build_sweep_frame.py,
# sample_failures.py) need this -- scoring itself stays pandas-free.
#
# statsmodels/pymc are for graphtalk/mixed_models.py and
# graphtalk/hierarchical_model.py only (the GEE and Bayesian hierarchical
# cross-checks) -- graphtalk/significance.py itself stays hand-rolled and
# scipy/statsmodels-free, per its own module docstring; these two are a
# deliberate, scoped exception for models a permutation test can't do
# (population-averaged and partial-pooling estimation), not a reversal of
# that policy.
analysis = [
    "pandas>=2.0",
    "statsmodels>=0.14",
    "pymc>=5.10",
]

[tool.pytest.ini_options]
testpaths = ["talk_like_a_graph", "tests"]

[tool.setuptools]
packages = ["talk_like_a_graph", "graphtalk"]
