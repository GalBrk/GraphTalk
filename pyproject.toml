[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtalk"
version = "0.1.0"
description = "Structural primers for LLMs reading graphs as text, building on Talk like a Graph (arXiv:2310.04560)"
requires-python = ">=3.11"

dependencies = [
    "networkx>=3.6",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Generation only (scripts/run_sweep.py via graphtalk/hf_backend.py); Qwen3 needs transformers 4.51+.
gpu = [
    "torch",
    "transformers>=4.51",
    "accelerate",
]
dev = [
    "absl-py>=2.5",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["talk_like_a_graph", "tests", "preliminary/tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["talk_like_a_graph", "graphtalk"]
